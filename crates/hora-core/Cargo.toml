[package]
name = "hora-core"
description = "Core of Hora: configuration, probing, SQLite storage, TLS-expiry and scheduling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
# The time zone database is compiled in: a recurring maintenance window's
# `timezone` must resolve in a container image that ships none.
jiff = { workspace = true, features = ["tzdb-bundle-always"] }
croner.workspace = true
futures-util.workspace = true
hickory-resolver = { workspace = true }
hora-notify.workspace = true
# jq assertions: compiled once at load, evaluated without env/filesystem access.
jaq-core = "3.1.2"
jaq-std = { version = "3.0.4", default-features = false, features = ["std"] }
jaq-json = { version = "2.0.3", features = ["sync", "serde"] }
# MQTT monitors: one shared client per broker (rustls on aws-lc, as reqwest).
mqtt-glide = { version = "0.5.2", default-features = false, features = ["tls-rustls-aws-lc"] }
notify.workspace = true
regex = "1.13.2"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_path = "0.7.2"
sha2.workspace = true
socket2 = "0.6.5"
sqlx.workspace = true
surge-ping = "0.9.1"
tokio = { workspace = true, features = ["rt", "time", "net", "sync", "signal", "process"] }
tokio-rustls.workspace = true
toml.workspace = true
tracing.workspace = true
utoipa.workspace = true
x509-parser.workspace = true

# Exec probes kill a timed-out plugin's whole process group (`killpg`), which
# std does not expose and `unsafe` (libc) is forbidden. Already in the tree.
# `fs` adds `statvfs`, for the free-disk check of `hora compact`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", default-features = false, features = ["signal", "process", "fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "process", "test-util"] }

[lints]
workspace = true

[features]
# `db::Store::in_memory` and the raw fixture pool, for the other crates' tests.
test-support = []
