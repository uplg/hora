[workspace]
resolver = "3"
members = [
    "crates/hora-notify",
    "crates/hora-core",
    "crates/hora-web",
    "crates/hora",
]

[workspace.package]
version = "0.11.2"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
askama = "0.16.1"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
notify = "8.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "charset", "http2", "socks", "gzip", "brotli", "deflate", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1.53.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["cors", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x509-parser = "0.18.1"
croner = "4.0"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
sha2 = "0.11"
utoipa = "6.0.0"

hora-core = { path = "crates/hora-core" }
hora-notify = { path = "crates/hora-notify" }
hora-web = { path = "crates/hora-web" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
